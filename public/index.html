<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Medspa Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="/vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="appbar">
  <h1>Medspa Finder</h1>
  <nav class="tabs" role="tablist" aria-label="View">
    <button class="tab" data-tab="map" role="tab" aria-selected="true">Map</button>
    <button class="tab" data-tab="grid" role="tab" aria-selected="false">Grid</button>
    <button class="tab" data-tab="table" role="tab" aria-selected="false">Table</button>
  </nav>
  <div class="stats" id="stats">Loading…</div>
</header>

<main>
  <section id="view-map" class="view active" role="tabpanel">
    <aside class="sidebar">
      <input type="search" id="citySearch" list="cityList" placeholder="Search a city…" aria-label="Search a city">
      <datalist id="cityList"></datalist>
      <div class="chips" id="mapChips"></div>
      <div class="pinbox">
        <button id="pinToggle" class="btn" aria-pressed="false">Drop a pin: 3 nearest</button>
        <label class="radiusLabel">Nearby within <input type="range" id="radius" min="1" max="15" value="5"> <b id="radiusVal">5 mi</b></label>
        <div id="pinResult"></div>
      </div>
      <div class="exportbox">
        <label for="exportState">Export / plan by state</label>
        <select id="exportState" aria-label="State"><option value="all">All states</option></select>
        <a id="csvLink" class="btn" href="/api/export.csv" download>Download CSV</a>
        <button id="planBtn" class="btn" type="button">Generate plan</button>
      </div>
      <div class="statelist" id="stateList"></div>
    </aside>
    <div id="map" aria-label="Map of practices"></div>
  </section>

  <section id="view-grid" class="view" role="tabpanel">
    <div class="band">
      <div class="wrap">
        <div class="search-row">
          <input type="search" id="gridSearch" list="gridCityList" placeholder="Filter by city or practice name…" aria-label="Filter by city or practice name">
          <datalist id="gridCityList"></datalist>
        </div>
        <div id="gridView"></div>
      </div>
    </div>
  </section>

  <section id="view-table" class="view" role="tabpanel">
    <div class="tablewrap">
      <div class="table-bar">
        <input type="search" id="tableSearch" placeholder="Filter by name or city…" aria-label="Filter by name or city">
        <select id="tableStatus" aria-label="Status filter">
          <option value="all">All</option>
          <option value="not_contacted">Not contacted</option>
          <option value="contacted">Contacted</option>
          <option value="meeting_set">Meeting set</option>
          <option value="onboarded">Onboarded</option>
        </select>
        <span id="tableCount" class="muted"></span>
        <span class="pager"><button class="btn" id="tablePrev" type="button">&lsaquo; Prev</button> <span id="tablePage"></span> <button class="btn" id="tableNext" type="button">Next &rsaquo;</button></span>
      </div>
      <div class="table-scroll"><table class="crmtable" id="crmTable"></table></div>
    </div>
  </section>
</main>

<div id="planModal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="planTitle">
    <button class="modal-close" id="planClose" aria-label="Close">&times;</button>
    <h2 id="planTitle">Market plan</h2>
    <div id="planBody" class="plan-body"></div>
  </div>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="/common.js"></script>
<script src="/map.js"></script>
<script src="/grid.js"></script>
<script src="/table.js"></script>
<script src="/export.js"></script>
<script src="/app.js"></script>
</body>
</html>
